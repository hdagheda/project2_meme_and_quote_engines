name: CI/CD - Project 2 Python app to AWS ECS (Staging + Production)

on:
  push:
    branches: [ staging, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_REGION: ap-southeast-2
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      CONTAINER_NAME: project2-meme-quote
      TASK_FAMILY: project2-task

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest || echo "No tests found"

      - name: Debug Secrets Visibility
        run: |
          echo "Access Key ID length: ${#AWS_ACCESS_KEY_ID}"
          echo "Region: $AWS_REGION"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Determine environment
        id: env-select
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "service=${{ secrets.ECS_SERVICE_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "service=${{ secrets.ECS_SERVICE_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Render new ECS task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ secrets.TASK_FAMILY }}
          container-name: ${{ secrets.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          cpu: 256
          memory: 512
          port-mappings: '[{"containerPort":3000,"hostPort":3000,"protocol":"tcp"}]'
          log-configuration: |
            {
              "logDriver": "awslogs",
              "options": {
                "awslogs-group": "/ecs/project2",
                "awslogs-region": "ap-southeast-2",
                "awslogs-stream-prefix": "ecs"
              }
            }
          execution-role-arn: arn:aws:iam::500490189426:role/ecsTaskExecutionRole
          network-mode: awsvpc
          requires-compatibilities: FARGATE

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ steps.env-select.outputs.service }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
