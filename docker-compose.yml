version: "3.9"

services:
  web:
    build:
      context: .
    container_name: meme-app
    environment:
      FLASK_APP: app.py
      PORT: "3000"
    ports:
      - "3000:3000"
    command: >
      sh -lc 'flask run --host 0.0.0.0 --port ${PORT} --reload'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT}/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
